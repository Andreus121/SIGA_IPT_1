services:
  postgres-db:
    image: postgres:16-alpine
    container_name: siga_postgresql
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5090:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: