version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: siga-postgres
    environment:
      POSTGRES_DB: SigaIPT_DB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password1234
    ports:
      - "5090:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: siga-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: SigaIPT_DB
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: password1234
      KC_HOSTNAME_STRICT: false
    ports:
      - "8090:8080"
    depends_on:
      - db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: siga-backend
    depends_on:
      - db
      - keycloak
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/SigaIPT_DB?sslmode=disable
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password1234
      SPRING_PROFILES_ACTIVE: default
    ports:
      - "8080:8080"
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: siga-nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
