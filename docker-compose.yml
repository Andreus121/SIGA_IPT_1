services:
  postgres:
    image: postgres:16-alpine
    container_name: siga-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5090:5432"   # puerto externo 5090 → interno 5432

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: siga-keycloak
    command: start-dev                # modo de desarrollo (no producción)
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_USERNAME}          # usuario admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}  # contraseña admin
      KC_DB: postgres                 # usar la misma BD que la app
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${DB_NAME}
      KC_DB_USERNAME: ${DB_USERNAME}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME_STRICT: false       # permite acceso con localhost
    ports:
      - "8090:8090"   # Keycloak UI en http://localhost:8080
    depends_on:
      - postgres

volumes:
  postgres_data: