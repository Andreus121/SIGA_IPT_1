spring.application.name=siga-ipt
# Conectar a la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5090/${DB_NAME:siga_db}?sslmode=disable
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Activa la creación/actualización automática de tablas
spring.jpa.hibernate.ddl-auto=update

# Opcional: Muestra las consultas SQL que Hibernate ejecuta en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true