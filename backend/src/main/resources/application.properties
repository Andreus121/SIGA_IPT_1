spring.application.name=siga-ipt

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Activa la creación/actualización automática de tablas
spring.jpa.hibernate.ddl-auto=update

# Opcional: Muestra las consultas SQL que Hibernate ejecuta en consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/siga-ipt
