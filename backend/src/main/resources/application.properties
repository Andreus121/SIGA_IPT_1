spring.application.name=siga-ipt

# Documentación OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Conectar a la base de datos
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:SigaIPT_DB}
spring.datasource.username=${DB_USERNAME:siga_ipt_username}
spring.datasource.password=${DB_PASSWORD:siga_ipt_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Convención JSON del equipo: snake_case, fechas ISO-8601
spring.jackson.property-naming-strategy=SNAKE_CASE

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keycloak (Resource Server - validación JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8090}/realms/siga-realm

# Reintentos usados durante el seed y la creación de usuarios
keycloak.admin.max-attempts=${KEYCLOAK_ADMIN_MAX_ATTEMPTS:12}
keycloak.admin.retry-delay-ms=${KEYCLOAK_ADMIN_RETRY_DELAY_MS:5000}

# Keycloak Admin API (para crear usuarios programáticamente)
keycloak.internal.url=http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8090}
keycloak.admin.realm=siga-realm
keycloak.admin.username=${KEYCLOAK_USERNAME:keycloak_username}
keycloak.admin.password=${KEYCLOAK_PASSWORD:keycloak_pass}
