services:
  postgres:
    image: postgres:16-alpine
    container_name: siga-postgres
    env_file: 
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-siga_ipt}
      POSTGRES_USER: ${DB_USERNAME:-siga_ipt_username}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-siga_ipt_pass}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-siga_ipt_username} -d ${DB_NAME:-siga_ipt}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${DB_PORT:-5432}:5432"  
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: siga-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_USERNAME:-keycloak_username}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-keycloak_pass}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${DB_NAME:-siga_ipt}
      KC_DB_USERNAME: ${DB_USERNAME:-siga_ipt_username}
      KC_DB_PASSWORD: ${DB_PASSWORD:-siga_ipt_pass}
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8090}
      KC_HOSTNAME_STRICT: false       # permite acceso con localhost
      KEYCLOAK_FRONT_URL: ${KEYCLOAK_FRONT_URL:-http://localhost:5173}
      KC_HEALTH_ENABLED: true
    ports:
      - "${KEYCLOAK_PORT:-8090}:8080" # Keycloak UI en http://localhost:8090
    volumes:
      - ./keycloak/siga-realm.json:/opt/keycloak/data/import/siga-realm.json:ro
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME es obligatorio}/siga-ipt-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-siga_ipt}?sslmode=disable
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-siga_ipt_username}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-siga_ipt_pass}
      SPRING_PROFILES_ACTIVE: default
      KEYCLOAK_HOST: keycloak
      KEYCLOAK_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    scale: 3 # quitar # cuando se quieran usar las 3 copias
    restart: unless-stopped  

  
  nginx:
    image: nginx:latest
    container_name: siga-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME es obligatorio}/siga-ipt-frontend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    expose:
      - "80"
    depends_on:
      - keycloak
    scale: 3 # quitar # cuando se quieran usar las 3 copias
    restart: unless-stopped

volumes:
  postgres_data:
  maven_cache:
