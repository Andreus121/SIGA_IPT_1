services:
  postgres:
    image: postgres:16-alpine
    container_name: siga-postgres
    env_file: 
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-siga_ipt}
      POSTGRES_USER: ${DB_USERNAME:-siga_ipt_username}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-siga_ipt_pass}
    ports:
      - "${DB_PORT:-5432}:5432"  
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: siga-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_USERNAME:-keycloak_username}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD:-keycloak_pass}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: ${DB_NAME:-siga_ipt}
      KC_DB_USERNAME: ${DB_USERNAME:-siga_ipt_username}
      KC_DB_PASSWORD: ${DB_PASSWORD:-siga_ipt_pass}
      KC_HOSTNAME_STRICT: false       # permite acceso con localhost
    ports:
      - "${KEYCLOAK_PORT:-8090}:8080" # Keycloak UI en http://localhost:8090
    volumes:
      - ./keycloak/siga-realm.json:/opt/keycloak/data/import/siga-realm.json:ro
    command: start-dev --import-realm
    depends_on:
      - postgres
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - .env
    depends_on:
      - postgres
      - keycloak
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-siga_ipt}?sslmode=disable
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-siga_ipt_username}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-siga_ipt_pass}
      SPRING_PROFILES_ACTIVE: default
      KEYCLOAK_HOST: keycloak
      KEYCLOAK_PORT: 8080
    scale: 3 # quitar # cuando se quieran usar las 3 copias
    restart: unless-stopped  

  # para levantar docker y eliminar las otras 2 copias usar
  # docker compose up -d --remove-orphans
  
  nginx:
    image: nginx:latest
    container_name: siga-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8090}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-siga-realm}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-siga-frontend}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:80}
    env_file:
      - .env
    expose:
      - "80"
    depends_on:
      - keycloak
    scale: 3 # quitar # cuando se quieran usar las 3 copias
    restart: unless-stopped

volumes:
  postgres_data:
