events {
    worker_connections 1024;
}

http {
    # Simple logging (can be expanded)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstream block defines the 3 backend replicas
    upstream backend {
        server backend:8080;  # Docker service name + port
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Proxy all requests to the Spring Boot backend
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 5173;
        server_name localhost;

        # Distribute requests across the frontend replicas.
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
